name: Feature request
description: Propose an enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem}
    validations: {required: true}
  - type: textarea
    id: solution
    attributes: {label: Proposed solution}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives}
  - type: textarea
    id: value
    attributes: {label: User value}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria}
    validations: {required: true}
  - type: textarea
    id: risks
    attributes: {label: Risks and dependencies}
  - type: textarea
    id: out-of-scope
    attributes: {label: Out of scope}
